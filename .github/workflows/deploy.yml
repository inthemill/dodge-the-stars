name: Deploy to Cyon

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: SSH-Schlüssel einrichten
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CYON_SSH_KEY }}

      - name: Hosting-Server als bekannt speichern
        run: ssh-keyscan -H "${{ secrets.CYON_HOST }}" >> ~/.ssh/known_hosts

      - name: Webseite deployen
        env:
          SSH_HOST: ${{ secrets.CYON_HOST }}
          SSH_USER: ${{ secrets.CYON_USER }}
          TARGET_PATH: public_html/dodge-the-stars
        run: |
          tar -cf dist.tar index.html script.js raumschiff.svg lootbox.svg
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET_PATH' && rm -rf '$TARGET_PATH'/*"
          scp dist.tar "$SSH_USER@$SSH_HOST:$TARGET_PATH/"
          ssh "$SSH_USER@$SSH_HOST" "cd '$TARGET_PATH' && tar -xf dist.tar && rm dist.tar"